[project]
name = "citador-ar-mcp"
version = "0.1.0"
description = "MCP server that answers whether a CSJN ruling is still good law, by building and classifying the citation graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lautaro Moya" }]
keywords = ["mcp", "legal", "argentina", "csjn", "jurisprudence", "citator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
ingest = [
    "pillow>=10.0",
    "pypdfium2>=4.30",
]

# Etapa de clasificacion por LLM, para los pasajes que las reglas no resuelven.
# Opcional y opt-in: ver ingest/llm.py y la variable CITADOR_LLM.
llm = [
    "anthropic>=1.0",
]

# Solo si se quieren PDFs con capa de texto buscable. Requiere Ghostscript,
# que ningun gestor de paquetes de Windows provee. El pipeline no lo necesita:
# ver ingest/ocr.py.
ocr = [
    "ocrmypdf>=16.0",
]

[project.scripts]
citador-ar-mcp = "citador_ar_mcp.server:main"

[project.urls]
Homepage = "https://github.com/LautaroMoya25/citador-ar-mcp"
Repository = "https://github.com/LautaroMoya25/citador-ar-mcp"
Issues = "https://github.com/LautaroMoya25/citador-ar-mcp/issues"
Changelog = "https://github.com/LautaroMoya25/citador-ar-mcp/blob/master/CHANGELOG.md"
# El grafo no viaja en el paquete: pesa 41 MB y se baja de acá.
"Corpus (release)" = "https://github.com/LautaroMoya25/citador-ar-mcp/releases/latest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/citador_ar_mcp"]

# El paquete pasa mypy --strict sobre domain/; sin este marcador los que lo
# consuman no ven los tipos.
artifacts = ["src/citador_ar_mcp/py.typed"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "T20"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ambiguous unicode: Spanish legal text is full of them

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
"src/citador_ar_mcp/ingest/*" = ["T20"]
"tests/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
files = ["src/citador_ar_mcp"]
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "citador_ar_mcp.domain.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
